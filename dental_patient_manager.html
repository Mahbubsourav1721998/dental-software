<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dental Patient Manager</title>

<!-- Excel Export Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<!-- Google Login / OAuth -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f5f8;
    margin:0;
    padding:20px;
    color:#222;
}

.container{
    max-width:850px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 3px 15px rgba(0,0,0,0.12);
}

h1{
    text-align:center;
    color:#1769aa;
}

h2,h3{
    margin-top:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-top:6px;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

button{
    padding:11px 15px;
    margin:10px 5px 5px 0;
    border:none;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    opacity:.85;
}

.save{
    background:#198754;
    color:white;
}

.blue{
    background:#1769aa;
    color:white;
}

.orange{
    background:#e09b00;
    color:white;
}

.red{
    background:#dc3545;
    color:white;
}

.gray{
    background:#777;
    color:white;
}

.status{
    margin-top:15px;
    padding:12px;
    background:#eef3f8;
    border-radius:7px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#e9f0f6;
}

.small{
    font-size:13px;
    color:#666;
}

hr{
    margin:25px 0;
    border:0;
    border-top:1px solid #ddd;
}

</style>
</head>

<body>

<div class="container">

<h1>🦷 Dental Patient Manager</h1>

<h3>Patient Information</h3>

<label>Patient Name</label>

<input
    type="text"
    id="name"
    placeholder="Enter patient name"
>


<label>Age</label>

<input
    type="number"
    id="age"
    min="0"
    max="150"
    placeholder="Enter age"
>


<label>Mobile Number</label>

<input
    type="tel"
    id="mobile"
    placeholder="01XXXXXXXXX"
>


<button class="save" onclick="savePatient()">
💾 Save Patient
</button>

<button class="gray" onclick="clearForm()">
Clear
</button>


<hr>

<h3>Backup & Export</h3>

<button class="blue" onclick="downloadJSON()">
⬇ Download JSON Backup
</button>

<button class="save" onclick="exportExcel()">
📊 Export Excel
</button>

<button class="orange"
        onclick="document.getElementById('jsonFile').click()">

↩ Restore JSON

</button>

<input
    type="file"
    id="jsonFile"
    accept=".json"
    style="display:none"
    onchange="restoreJSON(event)"
>


<hr>

<h3>☁ Google Drive Backup</h3>

<p class="small">

Google Drive ব্যবহার করার আগে JavaScript-এর
CLIENT_ID অংশে আপনার Google OAuth Web Client ID বসাতে হবে।

</p>

<button class="blue" onclick="googleDriveBackup()">

☁ Backup to Google Drive

</button>

<button class="orange" onclick="googleDriveRestore()">

☁ Restore from Google Drive

</button>


<div id="status" class="status">

Ready.

</div>


<hr>

<h3>Patient Search</h3>

<input
    type="text"
    id="search"
    placeholder="Search by name or mobile number"
    oninput="renderPatients()"
>


<table>

<thead>

<tr>

<th>Name</th>

<th>Age</th>

<th>Mobile</th>

<th>Action</th>

</tr>

</thead>

<tbody id="patientTable">

</tbody>

</table>

</div>


<script>

/* =========================================================
   LOCAL DATABASE
   IndexedDB
========================================================= */

const DB_NAME = "DentalPatientDatabase";

const DB_VERSION = 1;

const STORE_NAME = "patients";

let db;


/* Open Database */

function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,DB_VERSION);


        request.onupgradeneeded = function(event){

            const database =
                event.target.result;


            if(
                !database.objectStoreNames
                .contains(STORE_NAME)
            ){

                const store =
                    database.createObjectStore(
                        STORE_NAME,
                        {
                            keyPath:"id",
                            autoIncrement:true
                        }
                    );


                store.createIndex(
                    "name",
                    "name",
                    {
                        unique:false
                    }
                );


                store.createIndex(
                    "mobile",
                    "mobile",
                    {
                        unique:false
                    }
                );

            }

        };


        request.onsuccess = function(event){

            db = event.target.result;

            resolve(db);

        };


        request.onerror = function(event){

            reject(event.target.error);

        };

    });

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

    document.getElementById("status")
    .textContent = message;

}


/* =========================================================
   SAVE PATIENT
========================================================= */

function savePatient(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const age =
        document
        .getElementById("age")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    if(!name){

        alert("Please enter patient name.");

        return;

    }


    if(!age){

        alert("Please enter patient age.");

        return;

    }


    if(!mobile){

        alert("Please enter mobile number.");

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    store.add({

        name:name,

        age:Number(age),

        mobile:mobile,

        createdAt:
            new Date().toISOString()

    });


    transaction.oncomplete =
        function(){

            setStatus(
                "✅ Patient saved successfully."
            );

            clearForm();

            renderPatients();

        };


    transaction.onerror =
        function(){

            alert(
                "Unable to save patient."
            );

        };

}


/* =========================================================
   GET ALL PATIENTS
========================================================= */

function getAllPatients(){

    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    STORE_NAME,
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    STORE_NAME
                );


            const request =
                store.getAll();


            request.onsuccess =
                function(){

                    resolve(
                        request.result
                    );

                };


            request.onerror =
                function(){

                    reject(
                        request.error
                    );

                };

        }
    );

}


/* =========================================================
   DISPLAY PATIENTS
========================================================= */

async function renderPatients(){

    const patients =
        await getAllPatients();


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    const filtered =
        patients.filter(
            function(patient){

                return (

                    patient.name
                    .toLowerCase()
                    .includes(search)

                    ||

                    patient.mobile
                    .includes(search)

                );

            }
        );


    const table =
        document
        .getElementById("patientTable");


    table.innerHTML = "";


    filtered.forEach(
        function(patient){

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${escapeHTML(patient.name)}
                </td>

                <td>
                    ${patient.age}
                </td>

                <td>
                    ${escapeHTML(patient.mobile)}
                </td>

                <td>

                    <button
                        class="red"
                        onclick="deletePatient(${patient.id})"
                    >

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(text){

    return String(text)
    .replace(
        /[&<>"']/g,
        function(character){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[character];

        }
    );

}


/* =========================================================
   DELETE PATIENT
========================================================= */

function deletePatient(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this patient?"
        );


    if(!confirmDelete){

        return;

    }


    const transaction =
        db.transaction(
            STORE_NAME,
            "readwrite"
        );


    const store =
        transaction.objectStore(
            STORE_NAME
        );


    store.delete(id);


    transaction.oncomplete =
        function(){

            setStatus(
                "Patient deleted."
            );

            renderPatients();

        };

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(){

    document
    .getElementById("name")
    .value = "";


    document
    .getElementById("age")
    .value = "";


    document
    .getElementById("mobile")
    .value = "";


    document
    .getElementById("name")
    .focus();

}


/* =========================================================
   JSON BACKUP
========================================================= */

async function downloadJSON(){

    const patients =
        await getAllPatients();


    const backup = {

        application:
            "Dental Patient Manager",

        version:1,

        backupDate:
            new Date().toISOString(),

        patients:patients

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "dental-patient-backup.json";


    link.click();


    URL.revokeObjectURL(url);


    setStatus(
        "✅ JSON backup downloaded."
    );

}


/* =========================================================
   RESTORE JSON
========================================================= */

function restoreJSON(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            try{

                const backup =
                    JSON.parse(
                        reader.result
                    );


                if(
                    !Array.isArray(
                        backup.patients
                    )
                ){

                    throw new Error(
                        "Invalid backup file"
                    );

                }


                const transaction =
                    db.transaction(
                        STORE_NAME,
                        "readwrite"
                    );


                const store =
                    transaction.objectStore(
                        STORE_NAME
                    );


                backup.patients.forEach(
                    function(patient){

                        store.put({

                            name:
                                String(
                                    patient.name || ""
                                ),

                            age:
                                Number(
                                    patient.age || 0
                                ),

                            mobile:
                                String(
                                    patient.mobile || ""
                                ),

                            createdAt:
                                patient.createdAt
                                ||
                                new Date()
                                .toISOString()

                        });

                    }
                );


                transaction.oncomplete =
                    function(){

                        setStatus(
                            "✅ JSON backup restored."
                        );

                        renderPatients();

                    };


            }
            catch(error){

                alert(
                    "Invalid JSON backup file."
                );

            }

        };


    reader.readAsText(file);


    event.target.value = "";

}


/* =========================================================
   EXCEL EXPORT
========================================================= */

async function exportExcel(){

    const patients =
        await getAllPatients();


    if(patients.length === 0){

        alert(
            "No patient data available."
        );

        return;

    }


    const excelData =
        patients.map(
            function(patient,index){

                return {

                    "SL":
                        index + 1,

                    "Patient Name":
                        patient.name,

                    "Age":
                        patient.age,

                    "Mobile Number":
                        patient.mobile,

                    "Created At":
                        patient.createdAt

                };

            }
        );


    const worksheet =
        XLSX.utils.json_to_sheet(
            excelData
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Patients"
    );


    XLSX.writeFile(
        workbook,
        "dental-patients.xlsx"
    );


    setStatus(
        "✅ Excel file downloaded."
    );

}


/* =========================================================
   GOOGLE DRIVE
========================================================= */


/*
   IMPORTANT:

   এখানে আপনার Google OAuth Web Client ID বসাতে হবে।

   Example:

   const CLIENT_ID =
   "123456789-xxxxxxxx.apps.googleusercontent.com";

*/

const CLIENT_ID =
"PASTE_YOUR_GOOGLE_OAUTH_WEB_CLIENT_ID_HERE";


const DRIVE_SCOPE =
"https://www.googleapis.com/auth/drive.file";


let tokenClient = null;

let accessToken = null;


/* Initialize Google */

function initializeGoogle(){

    if(
        !window.google ||
        !google.accounts ||
        !google.accounts.oauth2
    ){

        setTimeout(
            initializeGoogle,
            500
        );

        return;

    }


    tokenClient =
        google.accounts.oauth2
        .initTokenClient({

            client_id:
                CLIENT_ID,

            scope:
                DRIVE_SCOPE,

            callback:
                function(response){

                    if(response.error){

                        setStatus(
                            "Google login failed."
                        );

                        return;

                    }


                    accessToken =
                        response.access_token;


                    setStatus(
                        "Google authorization successful."
                    );

                }

        });

}


/* Get Google Access Token */

function getGoogleToken(){

    return new Promise(
        function(resolve,reject){

            if(
                CLIENT_ID.startsWith(
                    "PASTE_"
                )
            ){

                alert(
                    "First enter your Google OAuth Client ID in the HTML code."
                );

                reject(
                    new Error(
                        "Client ID missing"
                    )
                );

                return;

            }


            if(accessToken){

                resolve(
                    accessToken
                );

                return;

            }


            tokenClient.callback =
                function(response){

                    if(response.error){

                        reject(
                            response
                        );

                    }
                    else{

                        accessToken =
                            response.access_token;

                        resolve(
                            accessToken
                        );

                    }

                };


            tokenClient
            .requestAccessToken({
                prompt:"consent"
            });

        }
    );

}


/* =========================================================
   FIND / CREATE GOOGLE DRIVE FOLDER
========================================================= */

async function findOrCreateDriveFolder(
    token
){

    const query =
        encodeURIComponent(

            "name = 'Dental Software Backup' " +

            "and mimeType = " +

            "'application/vnd.google-apps.folder' " +

            "and trashed = false"

        );


    const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files" +

            "?q=" + query +

            "&spaces=drive" +

            "&fields=files(id,name)",

            {

                headers:{

                    Authorization:
                        "Bearer " + token

                }

            }

        );


    if(!response.ok){

        throw new Error(
            await response.text()
        );

    }


    const data =
        await response.json();


    if(data.files.length > 0){

        return data.files[0].id;

    }


    const create =
        await fetch(

            "https://www.googleapis.com/drive/v3/files",

            {

                method:"POST",

                headers:{

                    Authorization:
                        "Bearer " + token,

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        name:
                            "Dental Software Backup",

                        mimeType:
                            "application/vnd.google-apps.folder"

                    })

            }

        );


    if(!create.ok){

        throw new Error(
            await create.text()
        );

    }


    const folder =
        await create.json();


    return folder.id;

}


/* =========================================================
   FIND BACKUP FILE
========================================================= */

async function findBackupFile(
    token,
    folderId
){

    const query =
        encodeURIComponent(

            "name = 'dental-patient-backup.json' " +

            "and '" +

            folderId +

            "' in parents " +

            "and trashed = false"

        );


    const response =
        await fetch(

            "https://www.googleapis.com/drive/v3/files" +

            "?q=" + query +

            "&spaces=drive" +

            "&fields=files(id,name)",

            {

                headers:{

                    Authorization:
                        "Bearer " + token

                }

            }

        );


    if(!response.ok){

        throw new Error(
            await response.text()
        );

    }


    const data =
        await response.json();


    if(data.files.length > 0){

        return data.files[0].id;

    }


    return null;

}


/* =========================================================
   GOOGLE DRIVE BACKUP
========================================================= */

async function googleDriveBackup(){

    try{

        setStatus(
            "Connecting to Google..."
        );


        const token =
            await getGoogleToken();


        const patients =
            await getAllPatients();


        const backup = {

            application:
                "Dental Patient Manager",

            version:1,

            backupDate:
                new Date().toISOString(),

            patients:patients

        };


        const folderId =
            await findOrCreateDriveFolder(
                token
            );


        const existingFile =
            await findBackupFile(
                token,
                folderId
            );


        const boundary =
            "DentalBoundary" +
            Date.now();


        const metadata = {

            name:
                "dental-patient-backup.json",

            mimeType:
                "application/json"

        };


        if(!existingFile){

            metadata.parents =
                [folderId];

        }


        const body =
            "--" + boundary + "\r\n" +

            "Content-Type: application/json; charset=UTF-8\r\n\r\n" +

            JSON.stringify(metadata) +

            "\r\n" +

            "--" + boundary + "\r\n" +

            "Content-Type: application/json\r\n\r\n" +

            JSON.stringify(
                backup,
                null,
                2
            ) +

            "\r\n" +

            "--" + boundary + "--";


        let url =
            "https://www.googleapis.com/upload/drive/v3/files" +

            "?uploadType=multipart";


        let method = "POST";


        if(existingFile){

            url =
                "https://www.googleapis.com/upload/drive/v3/files/" +

                existingFile +

                "?uploadType=multipart";


            method = "PATCH";

        }


        const response =
            await fetch(

                url,

                {

                    method:method,

                    headers:{

                        Authorization:
                            "Bearer " + token,

                        "Content-Type":
                            "multipart/related; boundary=" +

                            boundary

                    },

                    body:body

                }

            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        setStatus(
            "✅ Backup successfully saved to Google Drive."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "Google Drive backup failed. " +
            "Please check Google OAuth settings."
        );

    }

}


/* =========================================================
   GOOGLE DRIVE RESTORE
========================================================= */

async function googleDriveRestore(){

    try{

        setStatus(
            "Searching Google Drive..."
        );


        const token =
            await getGoogleToken();


        const folderId =
            await findOrCreateDriveFolder(
                token
            );


        const fileId =
            await findBackupFile(
                token,
                folderId
            );


        if(!fileId){

            alert(
                "No backup file found in Google Drive."
            );

            return;

        }


        const response =
            await fetch(

                "https://www.googleapis.com/drive/v3/files/" +

                fileId +

                "?alt=media",

                {

                    headers:{

                        Authorization:
                            "Bearer " + token

                    }

                }

            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const backup =
            await response.json();


        if(
            !Array.isArray(
                backup.patients
            )
        ){

            throw new Error(
                "Invalid backup."
            );

        }


        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );


        const store =
            transaction.objectStore(
                STORE_NAME
            );


        backup.patients.forEach(
            function(patient){

                store.put({

                    name:
                        String(
                            patient.name || ""
                        ),

                    age:
                        Number(
                            patient.age || 0
                        ),

                    mobile:
                        String(
                            patient.mobile || ""
                        ),

                    createdAt:
                        patient.createdAt
                        ||
                        new Date()
                        .toISOString()

                });

            }
        );


        transaction.oncomplete =
            function(){

                setStatus(
                    "✅ Google Drive backup restored."
                );

                renderPatients();

            };


    }
    catch(error){

        console.error(error);

        alert(
            "Google Drive restore failed."
        );

    }

}


/* =========================================================
   START APPLICATION
========================================================= */

(async function(){

    try{

        await openDatabase();

        await renderPatients();

        initializeGoogle();

        setStatus(
            "✅ Database ready. You can save patients."
        );

    }
    catch(error){

        console.error(error);

        setStatus(
            "Database initialization failed."
        );

    }

})();

</script>

</body>
